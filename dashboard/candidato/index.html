<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Dashboard — Corvus Talent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        nav {
            background: #0a1628;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        nav a { color: white; text-decoration: none; margin-right: 2rem; }
        nav a:hover { color: #8fa8c8; }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #ddd;
        }
        .tab-button {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 1rem;
            color: #666;
            transition: all 0.3s;
        }
        .tab-button.active {
            color: #0a1628;
            border-bottom-color: #8fa8c8;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .tab-content.active {
            display: block;
        }
        .solicitud-item {
            background: #f9f9f9;
            border-left: 4px solid #8fa8c8;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .solicitud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .solicitud-from {
            font-weight: bold;
            color: #0a1628;
        }
        .solicitud-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-accepted { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .solicitud-message {
            color: #666;
            margin: 0.75rem 0;
            line-height: 1.5;
        }
        .solicitud-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-accept {
            background: #10b981;
            color: white;
        }
        .btn-accept:hover { background: #059669; }
        .btn-reject {
            background: #ef4444;
            color: white;
        }
        .btn-reject:hover { background: #dc2626; }
        .btn-logout {
            background: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
        }
        .btn-logout:hover { background: #dc2626; }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #999;
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🦅 Corvus Talent</div>
        <div class="nav-right">
            <span id="user-name">Cargando...</span>
            <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('solicitudes')">Solicitudes (Recibidas)</button>
            <button class="tab-button" onclick="switchTab('enviadas')">Solicitudes (Enviadas)</button>
            <button class="tab-button" onclick="switchTab('perfil')">Mi Perfil</button>
        </div>

        <!-- TAB: SOLICITUDES RECIBIDAS -->
        <div id="solicitudes" class="tab-content active">
            <h2>Solicitudes de Contacto Recibidas</h2>
            <div id="solicitudes-container"></div>
        </div>

        <!-- TAB: SOLICITUDES ENVIADAS -->
        <div id="enviadas" class="tab-content">
            <h2>Solicitudes que Envié (Recruiters)</h2>
            <div id="enviadas-container"></div>
        </div>

        <!-- TAB: PERFIL -->
        <div id="perfil" class="tab-content">
            <h2>Mi Perfil</h2>
            <div id="perfil-container"></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm';

        const SUPABASE_URL = 'https://fciquzvndvbbqecboumg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjaXF1enZuZHZiYnFlY2JvdW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjQyOTc4NjUsImV4cCI6MjA0MDExMzg2NX0.s_U5p_DF5j7HPJvzDNNS7PfFzMmMd2K6zTnc-8Egh9A';

        // Hacer global para que onclick= lo encuentre
        window.logout = logout;
        window.switchTab = switchTab;
        window.respondSolicitud = respondSolicitud;

        function getToken() {
            const token = localStorage.getItem('corvus_token');
            console.log('[getToken] Token obtenido:', token);
            return token;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'solicitudes') loadSolicitudes();
            if (tabName === 'enviadas') loadEnviadas();
            if (tabName === 'perfil') loadPerfil();
        }

        async function loadSolicitudes() {
            const token = getToken();
            if (!token) {
                showError('solicitudes', 'No hay sesión activa. Por favor, inicia sesión.');
                return;
            }

            try {
                const response = await fetch('/api/moderation', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                console.log('[loadSolicitudes] Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                console.log('[loadSolicitudes] Data:', data);

                const solicitudes = Array.isArray(data) ? data : [];
                const container = document.getElementById('solicitudes-container');

                if (solicitudes.length === 0) {
                    container.innerHTML = '<div class="empty-state">No hay solicitudes recibidas.</div>';
                    return;
                }

                container.innerHTML = solicitudes.map(s => `
                    <div class="solicitud-item">
                        <div class="solicitud-header">
                            <div>
                                <div class="solicitud-from">${s.recruiter_name || s.recruiter_email || 'Recruiter'}</div>
                                <div style="font-size: 0.9rem; color: #999;">${s.company || 'Empresa no especificada'}</div>
                            </div>
                            <span class="solicitud-status status-${s.status}">${s.status.toUpperCase()}</span>
                        </div>
                        <div class="solicitud-message">${s.message || '(Sin mensaje)'}</div>
                        ${s.status === 'pending' ? `
                            <div class="solicitud-actions">
                                <button class="btn btn-accept" onclick="respondSolicitud(${s.id}, 'accepted')">Aceptar</button>
                                <button class="btn btn-reject" onclick="respondSolicitud(${s.id}, 'rejected')">Rechazar</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('[loadSolicitudes] Error:', error);
                showError('solicitudes', `Error cargando solicitudes: ${error.message}`);
            }
        }

        async function respondSolicitud(requestId, status) {
            const token = getToken();
            if (!token) {
                showError('solicitudes', 'No hay sesión activa.');
                return;
            }

            try {
                const response = await fetch('/api/moderation', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action: 'respond_contact_request',
                        request_id: requestId,
                        status: status,
                        token: token
                    })
                });

                console.log('[respondSolicitud] Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                showSuccess('solicitudes', `Solicitud ${status === 'accepted' ? 'aceptada' : 'rechazada'}.`);
                setTimeout(() => loadSolicitudes(), 1000);
            } catch (error) {
                console.error('[respondSolicitud] Error:', error);
                showError('solicitudes', `Error respondiendo solicitud: ${error.message}`);
            }
        }

        async function loadEnviadas() {
            const token = getToken();
            if (!token) return;

            try {
                const response = await fetch('/api/moderation?type=sent', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const data = await response.json();
                const solicitudes = Array.isArray(data) ? data : [];
                const container = document.getElementById('enviadas-container');

                if (solicitudes.length === 0) {
                    container.innerHTML = '<div class="empty-state">No has enviado solicitudes.</div>';
                    return;
                }

                container.innerHTML = solicitudes.map(s => `
                    <div class="solicitud-item">
                        <div class="solicitud-header">
                            <div>
                                <div class="solicitud-from">${s.candidate_name || s.candidate_email || 'Candidato'}</div>
                            </div>
                            <span class="solicitud-status status-${s.status}">${s.status.toUpperCase()}</span>
                        </div>
                        <div class="solicitud-message">${s.message || '(Sin mensaje)'}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('[loadEnviadas] Error:', error);
                showError('enviadas', `Error cargando solicitudes: ${error.message}`);
            }
        }

        async function loadPerfil() {
            const token = getToken();
            if (!token) return;

            try {
                const response = await fetch('/api/profile', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const data = await response.json();
                const container = document.getElementById('perfil-container');
                container.innerHTML = `
                    <div style="background: #f9f9f9; padding: 2rem; border-radius: 8px;">
                        <p><strong>Email:</strong> ${data.email || 'N/A'}</p>
                        <p><strong>Nombre:</strong> ${data.nombre || 'N/A'}</p>
                        <p><strong>Empresa:</strong> ${data.company || 'N/A'}</p>
                        <p><strong>Rubro:</strong> ${data.rubro || 'N/A'}</p>
                        <p><strong>Seniority:</strong> ${data.seniority || 'N/A'}</p>
                    </div>
                `;
            } catch (error) {
                console.error('[loadPerfil] Error:', error);
                showError('perfil', `Error cargando perfil: ${error.message}`);
            }
        }

        function showError(tab, message) {
            const container = document.getElementById(tab + '-container');
            container.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function showSuccess(tab, message) {
            const container = document.getElementById(tab + '-container');
            const msg = document.createElement('div');
            msg.className = 'success-message';
            msg.textContent = message;
            container.insertBefore(msg, container.firstChild);
        }

        function logout() {
            localStorage.removeItem('corvus_token');
            localStorage.removeItem('corvus_user');
            window.location.href = '/auth';
        }

        // Init
        window.addEventListener('load', () => {
            const user = JSON.parse(localStorage.getItem('corvus_user') || '{}');
            document.getElementById('user-name').textContent = user.nombre || 'Usuario';
            loadSolicitudes();
        });
    </script>
</body>
</html>
