<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes — Corvus Talent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #19273B 100%);
      color: #BABDC2;
      min-height: 100vh;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 2.5fr;
      height: 100vh;
      gap: 0;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .sidebar.mobile-active {
        display: block;
      }
    }

    /* SIDEBAR */
    .sidebar {
      background: #19273B;
      border-right: 1px solid #152132;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid #152132;
    }

    .sidebar-header h2 {
      color: #FFFFFF;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }

    .sidebar-header p {
      font-size: 0.85rem;
      color: #656D78;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .conversation-item {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #152132;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .conversation-item:hover {
      background: rgba(143, 168, 200, 0.05);
      border-left: 3px solid #8FA8C8;
      padding-left: calc(1.5rem - 3px);
    }

    .conversation-item.active {
      background: rgba(143, 168, 200, 0.1);
      border-left: 3px solid #8FA8C8;
      padding-left: calc(1.5rem - 3px);
    }

    /* AVATAR PEQUEÑO EN SIDEBAR */
    .conversation-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #8FA8C8;
      color: #0A1628;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
      position: relative;
    }

    .conversation-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .conversation-avatar.unread::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: #4CAF50;
      border-radius: 50%;
      border: 2px solid #19273B;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-name {
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-preview {
      color: #656D78;
      font-size: 0.8rem;
      margin-top: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* MAIN CHAT */
    .chat-container {
      display: flex;
      flex-direction: column;
      background: #0A1628;
    }

    .chat-header {
      background: #19273B;
      border-bottom: 1px solid #152132;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-info h3 {
      color: #FFFFFF;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .chat-header-info p {
      color: #656D78;
      font-size: 0.85rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.own {
      flex-direction: row-reverse;
    }

    /* AVATAR GRANDE EN CHAT */
    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #8FA8C8;
      color: #0A1628;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .message-bubble {
      max-width: 60%;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .message.own .message-bubble {
      align-items: flex-end;
    }

    .message-sender {
      color: #8FA8C8;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .message.own .message-sender {
      text-align: right;
    }

    .message-content {
      background: #19273B;
      color: #BABDC2;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .message.own .message-content {
      background: #8FA8C8;
      color: #0A1628;
    }

    .message-time {
      color: #656D78;
      font-size: 0.75rem;
      margin-top: 0.25rem;
    }

    .message.own .message-time {
      text-align: right;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      text-align: center;
      gap: 1rem;
    }

    .empty-state p {
      color: #656D78;
      font-size: 0.95rem;
    }

    /* INPUT */
    .chat-input {
      background: #19273B;
      border-top: 1px solid #152132;
      padding: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    .input-field {
      flex: 1;
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      background: #0A1628;
      border: 1px solid #152132;
      border-radius: 6px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #8FA8C8;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      background: #8FA8C8;
      color: #0A1628;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover:not(:disabled) {
      background: #A8BFD8;
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* NOTIFICACIÓN PERMISO */
    .notification-prompt {
      background: rgba(143, 168, 200, 0.1);
      border: 1px solid #8FA8C8;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .notification-prompt p {
      color: #BABDC2;
      font-size: 0.9rem;
      flex: 1;
    }

    .notification-prompt .btn {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }

    .notification-prompt .btn-dismiss {
      background: transparent;
      color: #8FA8C8;
      border: 1px solid #8FA8C8;
    }

    /* LOADING */
    .loading {
      text-align: center;
      color: #656D78;
      padding: 2rem;
    }

    .typing-indicator {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8FA8C8;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: 0.7;
      }
      30% {
        transform: translateY(-10px);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>💬 Mensajes</h2>
        <p>Tus conversaciones</p>
      </div>
      <ul id="conversationList" class="conversation-list"></ul>
    </div>

    <!-- CHAT -->
    <div class="chat-container">
      <!-- NOTIFICACIÓN DE PERMISO -->
      <div id="notificationPrompt" class="notification-prompt" style="display: none; margin: 1rem;">
        <p>Activa notificaciones para recibir alertas de nuevos mensajes.</p>
        <button class="btn" onclick="requestNotificationPermission()">Activar</button>
        <button class="btn btn-dismiss" onclick="dismissNotificationPrompt()">Descartar</button>
      </div>

      <!-- HEADER -->
      <div class="chat-header" id="chatHeader" style="display: none;">
        <div>
          <div id="chatHeaderAvatar" class="message-avatar"></div>
        </div>
        <div class="chat-header-info">
          <h3 id="chatHeaderName">Selecciona una conversación</h3>
          <p id="chatHeaderRole">-</p>
        </div>
      </div>

      <!-- MENSAJES -->
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">
          <p>👋 Selecciona una conversación para empezar</p>
        </div>
      </div>

      <!-- INPUT -->
      <div class="chat-input" id="chatInputSection" style="display: none;">
        <div class="input-field">
          <input 
            type="text" 
            id="messageInput" 
            placeholder="Escribe tu mensaje..." 
            onkeypress="handleInputKeypress(event)"
          >
          <button class="btn" id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../auth-check.js">
// ── REPORTES (SESIÓN 5) ──────────────────────────────────────
let reportedUserId = null;
let reportConversationId = null;

function openReportModal(userId, conversationId = null) {
  if (!userId) return; // No abrir si no hay usuario
  reportedUserId = userId;
  reportConversationId = conversationId;
  document.getElementById('reportModal').style.display = 'flex';
  document.getElementById('reportModal').style.alignItems = 'center';
  document.getElementById('reportModal').style.justifyContent = 'center';
  document.body.style.overflow = 'hidden';
  document.getElementById('reportForm').reset();
  document.getElementById('charCount').textContent = '0/1000';
  document.getElementById('reportEvidenceUrl').style.display = 'none';
}

function closeReportModal() {
  document.getElementById('reportModal').style.display = 'none';
  document.body.style.overflow = 'auto';
  reportedUserId = null;
  reportConversationId = null;
}

document.getElementById('reportDescription')?.addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length + '/1000';
});

document.getElementById('reportHasEvidence')?.addEventListener('change', function() {
  const url = document.getElementById('reportEvidenceUrl');
  url.style.display = this.checked ? 'block' : 'none';
  if (!this.checked) url.value = '';
});

async function submitReport(e) {
  e.preventDefault();
  if (!reportedUserId) return alert('Error: usuario no identificado');

  const type = document.getElementById('reportType').value;
  const desc = document.getElementById('reportDescription').value;
  const evidence = document.getElementById('reportHasEvidence').checked ? 
                   document.getElementById('reportEvidenceUrl').value : null;

  if (!type || desc.length < 10) {
    return alert('Por favor completa todos los campos');
  }

  const btn = document.getElementById('reportSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const token = localStorage.getItem('corvus_token') || sessionStorage.getItem('corvus_token');
    const res = await fetch('/api/moderation', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        action: 'create_report',
        reported_user_id: reportedUserId,
        report_type: type,
        description: desc,
        evidence_url: evidence || null,
        conversation_id: reportConversationId || null
      })
    });

    const data = await res.json();
    if (res.ok) {
      alert('✓ Reporte enviado. Nuestro equipo lo revisará pronto.');
      closeReportModal();
    } else {
      alert('Error: ' + (data.error || 'No se pudo enviar'));
    }
  } catch(err) {
    console.error(err);
    alert('Error al enviar el reporte');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar Reporte';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('reportModal').style.display === 'flex') {
    closeReportModal();
  }
});

document.getElementById('reportModal')?.addEventListener('click', function(e) {
  if (e.target === this) closeReportModal();
});

</script>
  <script>
    // STATE
    let conversations = [];
    let currentConversationId = null;
    let userId = null;
    let currentUser = null;
    let notificationPermissionAsked = false;

    // INIT
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
      
      // Obtener usuario actual
      const userResp = await fetch('/api/profile', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const userData = await userResp.json();
      currentUser = userData;
      userId = userData.id;

      // Cargar conversaciones
      await loadConversations(token);

      // Pedir permiso de notificaciones (pero no forzar)
      checkNotificationPermission();

      // Polling cada 3 segundos
      setInterval(() => {
        if (currentConversationId) {
          loadMessages(token);
        }
      }, 3000);
    });

    // NOTIFICACIONES DEL NAVEGADOR
    function checkNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default' && !notificationPermissionAsked) {
          // Mostrar prompt personalizado (no el del navegador aún)
          document.getElementById('notificationPrompt').style.display = 'flex';
        }
      }
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          notificationPermissionAsked = true;
          dismissNotificationPrompt();
        });
      }
    }

    function dismissNotificationPrompt() {
      document.getElementById('notificationPrompt').style.display = 'none';
      notificationPermissionAsked = true;
    }

    function showNotification(title, options = {}) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
          icon: '/favicon.svg',
          badge: '/favicon.svg',
          ...options
        });
      }
    }

    // LOAD CONVERSATIONS
    async function loadConversations(token) {
      try {
        const res = await fetch('/api/chat?action=list', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        conversations = data;
        renderConversations();
      } catch (err) {
        console.error('Error loading conversations:', err);
      }
    }

    // RENDER CONVERSATIONS CON AVATARES
    function renderConversations() {
      const list = document.getElementById('conversationList');
      
      if (conversations.length === 0) {
        list.innerHTML = `<div style="padding: 1.5rem; text-align: center; color: #656D78;">
          No hay conversaciones aún
        </div>`;
        return;
      }

      list.innerHTML = conversations.map(conv => {
        const isRecruiter = currentUser.role === 'recruiter';
        const otherUser = isRecruiter ? conv.candidate : conv.recruiter;
        const initials = getInitials(otherUser?.nombre, otherUser?.apellido);
        const hasUnread = isRecruiter ? conv.unread_count_recruiter > 0 : conv.unread_count_candidate > 0;

        return `
          <li class="conversation-item ${currentConversationId === conv.id ? 'active' : ''} ${hasUnread ? 'unread' : ''}" 
              onclick="selectConversation('${conv.id}', this)">
            <div class="conversation-avatar ${hasUnread ? 'unread' : ''}">
              ${otherUser?.avatar_url ? `<img src="${otherUser.avatar_url}" alt="">` : initials}
            </div>
            <div class="conversation-info">
              <div class="conversation-name">${otherUser?.nombre || 'Usuario'} ${otherUser?.apellido || ''}</div>
              <div class="conversation-preview">${conv.last_message || 'Sin mensajes aún'}</div>
            </div>
          </li>
        `;
      }).join('');
    }

    // SELECT CONVERSATION
    async function selectConversation(convId, element) {
      currentConversationId = convId;
      
      // UI update
      document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('chatInputSection').style.display = 'flex';
      document.getElementById('chatMessages').innerHTML = '<div class="loading">Cargando mensajes...</div>';

      // Load conversation data
      const conv = conversations.find(c => c.id === convId);
      const isRecruiter = currentUser.role === 'recruiter';
      const otherUser = isRecruiter ? conv.candidate : conv.recruiter;
      
      updateChatHeader(otherUser);
      
      const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
      await loadMessages(token);
    }

   // ACTUALIZACIÓN PARA: chat-notif-avatares.html
// Reemplazar la función updateChatHeader con esta versión mejorada

function updateChatHeader(user) {
  const initials = getInitials(user?.nombre, user?.apellido);
  const avatarEl = document.getElementById('chatHeaderAvatar');
  
  if (user?.avatar_url) {
    avatarEl.innerHTML = `<img src="${user.avatar_url}" alt="">`;
  } else {
    avatarEl.textContent = initials;
  }

  // NUEVO: Mostrar badges de reputación y verificación
  let headerHtml = `${user?.nombre || 'Usuario'} ${user?.apellido || ''}`;
  let roleText = user?.company || '-';

  // Badge de verificación
  if (user?.corporate_email_verified) {
    headerHtml += ' <span style="color: #4CAF50; font-size: 0.8rem;">🔵</span>';
  }

  // Badge de recruiter de confianza
  if (user?.es_recruiter_confianza) {
    headerHtml += ' <span style="color: #FFC107; font-size: 0.8rem;">⭐</span>';
  }

  document.getElementById('chatHeaderName').innerHTML = headerHtml;
  
  // Mostrar empresa + métricas de reputación si es recruiter
  if (user?.role === 'recruiter') {
    let metricsHtml = user?.company || '-';
    
    if (user?.solicitudes_aceptadas > 0) {
      const tasa = Math.round(user?.tasa_aceptacion || 0);
      metricsHtml += ` • ${user?.solicitudes_aceptadas} aceptaciones (${tasa}%)`;
    }

    if (user?.es_recruiter_confianza) {
      metricsHtml = `<span style="color: #FFC107;">⭐ Recruiter de confianza</span> • ${metricsHtml}`;
    } else if (user?.corporate_email_verified) {
      metricsHtml = `<span style="color: #4CAF50;">🔵 Verificado</span> • ${metricsHtml}`;
    }

    roleText = metricsHtml;
  }

  document.getElementById('chatHeaderRole').innerHTML = roleText;
}

// ACTUALIZACIÓN: Enriquecer los datos de usuario al cargar conversaciones
// Reemplazar la función selectConversation para incluir todos los datos de reputación

async function selectConversation(convId, element) {
  currentConversationId = convId;
  
  // UI update
  document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
  element.classList.add('active');

  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatInputSection').style.display = 'flex';
  document.getElementById('chatMessages').innerHTML = '<div class="loading">Cargando mensajes...</div>';

  // Load conversation data
  const conv = conversations.find(c => c.id === convId);
  const isRecruiter = currentUser.role === 'recruiter';
  const otherUserId = isRecruiter ? conv.candidate_id : conv.recruiter_id;

  // NUEVO: Obtener datos completos del usuario incluyendo reputación
  const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
  try {
    const res = await fetch(`/api/profile?user_id=${otherUserId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const otherUser = await res.json();
    updateChatHeader(otherUser);
  } catch (err) {
    // Fallback: usar datos básicos
    const otherUser = isRecruiter ? conv.candidate : conv.recruiter;
    updateChatHeader(otherUser);
  }
  
  await loadMessages(token);
}

// ACTUALIZACIÓN: Mostrar badges en los mensajes también
// Reemplazar la parte de renderizar mensajes en loadMessages

function renderMessagesWithReputation(messages) {
  const messagesContainer = document.getElementById('chatMessages');
  
  if (messages.length === 0) {
    messagesContainer.innerHTML = '<div class="empty-state"><p>📭 Inicia la conversación</p></div>';
    return;
  }

  messagesContainer.innerHTML = messages.map(msg => {
    const isOwn = msg.sender_id === userId;
    const initials = getInitials(msg.sender?.nombre, msg.sender?.apellido);
    const avatarHtml = msg.sender?.avatar_url 
      ? `<img src="${msg.sender.avatar_url}" alt="">`
      : initials;

    // NUEVO: Mostrar badges en el mensaje también
    let senderBadges = '';
    if (msg.sender?.corporate_email_verified) {
      senderBadges += ' <span style="color: #4CAF50; font-size: 0.7rem;">🔵</span>';
    }
    if (msg.sender?.es_recruiter_confianza) {
      senderBadges += ' <span style="color: #FFC107; font-size: 0.7rem;">⭐</span>';
    }

    return `
      <div class="message ${isOwn ? 'own' : ''}">
        <div class="message-avatar">${avatarHtml}</div>
        <div class="message-bubble">
          <div class="message-sender">${msg.sender_name}${senderBadges}</div>
          <div class="message-content">${escapeHtml(msg.content)}</div>
          <div class="message-time">${formatTime(msg.created_at)}</div>
        </div>
      </div>
    `;
  }).join('');

  // Scroll to bottom
  messagesContainer.scrollTop = messagesContainer.scrollHeight;

  // Mark as read
  const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
  markAsRead(token);
}

    // LOAD MESSAGES
    async function loadMessages(token) {
      if (!currentConversationId) return;

      try {
        const res = await fetch(`/api/chat?action=get&conversation_id=${currentConversationId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const messages = await res.json();

        const messagesContainer = document.getElementById('chatMessages');
        
        if (messages.length === 0) {
          messagesContainer.innerHTML = '<div class="empty-state"><p>📭 Inicia la conversación</p></div>';
          return;
        }

        // Detectar nuevo mensaje (para notificar)
        const oldCount = messagesContainer.children.length;
        const newMessages = messages.filter(m => m.sender_id !== userId);
        if (newMessages.length > 0 && oldCount > 1 && document.hidden) {
          const lastMsg = newMessages[newMessages.length - 1];
          showNotification(`Nuevo mensaje de ${lastMsg.sender_name}`, {
            body: lastMsg.content.substring(0, 50),
            tag: currentConversationId
          });
        }

        // Render messages CON AVATARES
        messagesContainer.innerHTML = messages.map(msg => {
          const isOwn = msg.sender_id === userId;
          const initials = getInitials(msg.sender?.nombre, msg.sender?.apellido);
          const avatarHtml = msg.sender?.avatar_url 
            ? `<img src="${msg.sender.avatar_url}" alt="">`
            : initials;

          return `
            <div class="message ${isOwn ? 'own' : ''}">
              <div class="message-avatar">${avatarHtml}</div>
              <div class="message-bubble">
                <div class="message-sender">${msg.sender_name}</div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-time">${formatTime(msg.created_at)}</div>
              </div>
            </div>
          `;
        }).join('');

        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Mark as read
        markAsRead(token);
      } catch (err) {
        console.error('Error loading messages:', err);
      }
    }

    // SEND MESSAGE
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();

      if (!content || !currentConversationId) return;

      const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
      const sendBtn = document.getElementById('sendBtn');

      sendBtn.disabled = true;
      input.value = '';

      try {
        await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            conversation_id: currentConversationId,
            content: content
          })
        });

        await loadMessages(token);
      } catch (err) {
        console.error('Error sending message:', err);
        input.value = content;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // MARK AS READ
    async function markAsRead(token) {
      try {
        await fetch(`/api/chat?action=mark_read&conversation_id=${currentConversationId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch (err) {
        console.error('Error marking as read:', err);
      }
    }

    // HELPERS
    function getInitials(nombre = '', apellido = '') {
      return `${(nombre[0] || '').toUpperCase()}${(apellido[0] || '').toUpperCase()}` || 'U';
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    function handleInputKeypress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
  
// ── REPORTES (SESIÓN 5) ──────────────────────────────────────
let reportedUserId = null;
let reportConversationId = null;

function openReportModal(userId, conversationId = null) {
  if (!userId) return; // No abrir si no hay usuario
  reportedUserId = userId;
  reportConversationId = conversationId;
  document.getElementById('reportModal').style.display = 'flex';
  document.getElementById('reportModal').style.alignItems = 'center';
  document.getElementById('reportModal').style.justifyContent = 'center';
  document.body.style.overflow = 'hidden';
  document.getElementById('reportForm').reset();
  document.getElementById('charCount').textContent = '0/1000';
  document.getElementById('reportEvidenceUrl').style.display = 'none';
}

function closeReportModal() {
  document.getElementById('reportModal').style.display = 'none';
  document.body.style.overflow = 'auto';
  reportedUserId = null;
  reportConversationId = null;
}

document.getElementById('reportDescription')?.addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length + '/1000';
});

document.getElementById('reportHasEvidence')?.addEventListener('change', function() {
  const url = document.getElementById('reportEvidenceUrl');
  url.style.display = this.checked ? 'block' : 'none';
  if (!this.checked) url.value = '';
});

async function submitReport(e) {
  e.preventDefault();
  if (!reportedUserId) return alert('Error: usuario no identificado');

  const type = document.getElementById('reportType').value;
  const desc = document.getElementById('reportDescription').value;
  const evidence = document.getElementById('reportHasEvidence').checked ? 
                   document.getElementById('reportEvidenceUrl').value : null;

  if (!type || desc.length < 10) {
    return alert('Por favor completa todos los campos');
  }

  const btn = document.getElementById('reportSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const token = localStorage.getItem('corvus_token') || sessionStorage.getItem('corvus_token');
    const res = await fetch('/api/moderation', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        action: 'create_report',
        reported_user_id: reportedUserId,
        report_type: type,
        description: desc,
        evidence_url: evidence || null,
        conversation_id: reportConversationId || null
      })
    });

    const data = await res.json();
    if (res.ok) {
      alert('✓ Reporte enviado. Nuestro equipo lo revisará pronto.');
      closeReportModal();
    } else {
      alert('Error: ' + (data.error || 'No se pudo enviar'));
    }
  } catch(err) {
    console.error(err);
    alert('Error al enviar el reporte');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar Reporte';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('reportModal').style.display === 'flex') {
    closeReportModal();
  }
});

document.getElementById('reportModal')?.addEventListener('click', function(e) {
  if (e.target === this) closeReportModal();
});

</script>
