<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — Corvus Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1628;--navy-mid:#142038;--slate:#8FA8C8;--white:#FFFFFF;--gray:#9CA3AF;--border:rgba(143,168,200,0.2);--green:#4ADE80;--red:#F87171;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  nav{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
  .nav-brand{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--white);text-decoration:none}
  .nav-brand span{color:var(--slate)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .card{background:var(--navy-mid);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:400px}
  .card-title{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
  .card-sub{font-size:13px;color:var(--gray);margin-bottom:28px;text-align:center;line-height:1.6}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  label{font-size:11px;color:var(--slate);letter-spacing:1px;text-transform:uppercase;font-weight:500}
  input{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--white);font-family:inherit;font-size:14px;outline:none;transition:border-color 0.2s;width:100%}
  input:focus{border-color:var(--slate)}
  ::placeholder{color:var(--gray)}
  .btn{width:100%;padding:13px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;margin-bottom:12px}
  .btn-primary{background:var(--white);color:var(--navy)}
  .btn-primary:hover{background:#f0f0f0}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5}
  .msg.success{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);color:var(--green);display:block}
  .msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:var(--red);display:block}
  .back-link{text-align:center;font-size:13px;color:var(--gray)}
  .back-link a{color:var(--slate);text-decoration:none}
  footer{padding:20px 24px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--gray)}
  footer span{color:var(--slate)}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">CORVUS <span>TALENT</span></a>
</nav>
<main>
  <div class="card">
    <h1 class="card-title">Recuperar contraseña</h1>
    <p class="card-sub">Ingresá tu email y te enviamos un link para restablecer tu contraseña.</p>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="tu@email.com">
    </div>
    <button class="btn btn-primary" id="btn-send" onclick="sendReset()">Enviar link de recuperación</button>
    <div class="back-link"><a href="/auth">← Volver al login</a></div>
  </div>
</main>
<footer>CORVUS <span>TALENT</span> · Talento certero.</footer>
<script>
async function sendReset() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg('Ingresá tu email.', 'error'); return; }

  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    // Siempre mostramos éxito por seguridad (no revelar si el email existe)
    showMsg('Si existe una cuenta con ese email, recibirás el link en los próximos minutos. Revisá también el spam.', 'success');
    document.getElementById('email').value = '';
  } catch(e) {
    showMsg('Error de conexión. Intentá de nuevo.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar link de recuperación';
  }
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendReset();
});
</script>
</body>
</html>
