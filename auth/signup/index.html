<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Corvus Talent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #152132 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #0a1628; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #8fa8c8;
            box-shadow: 0 0 0 3px rgba(143, 168, 200, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0a1628;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #152132;
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        a {
            color: #8fa8c8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .link-section {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>🦅 Crear Cuenta</h1>
        
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        
        <form id="signup-form">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña (mín. 8 caracteres)</label>
                <input type="password" id="password" name="password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="role">¿Eres candidato o recruiter?</label>
                <select id="role" name="role" required>
                    <option value="candidato">Candidato (buscando empleo)</option>
                    <option value="recruiter">Recruiter (buscando talento)</option>
                </select>
            </div>
            
            <button type="submit" id="submit-btn">Crear Cuenta</button>
        </form>
        
        <div class="link-section">
            <a href="/auth">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('signup-form');
        const nombreInput = document.getElementById('nombre');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const roleSelect = document.getElementById('role');
        const submitBtn = document.getElementById('submit-btn');
        const errorDiv = document.getElementById('error-msg');
        const successDiv = document.getElementById('success-msg');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Creando...' : 'Crear Cuenta';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);

            const nombre = nombreInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = roleSelect.value;

            try {
                console.log('[SIGNUP] Registrando:', email);

                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'register',
                        email: email,
                        password: password,
                        nombre: nombre,
                        role: role
                    })
                });

                console.log('[SIGNUP] Response status:', response.status);

                const data = await response.json();
                console.log('[SIGNUP] Response data:', data);

                if (!response.ok) {
                    console.error('[SIGNUP] Error:', data.error);
                    showError(`Error: ${data.error || 'Registro fallido'}`);
                    setLoading(false);
                    return;
                }

                console.log('[SIGNUP] ✅ Registro exitoso');

                showSuccess('✅ Cuenta creada exitosamente. Redirigiendo al login...');
                setTimeout(() => {
                    window.location.href = '/auth';
                }, 2000);
            } catch (error) {
                console.error('[SIGNUP] Unexpected error:', error);
                showError('Error: ' + error.message);
                setLoading(false);
            }
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('corvus_token');
            if (token) {
                console.log('[LOAD] Usuario ya logueado, redirigiendo');
                window.location.href = '/dashboard/candidato';
            }
        });
    </script>
</body>
</html>
