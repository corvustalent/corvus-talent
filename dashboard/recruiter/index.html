<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Recruiter — Corvus Talent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #babdc2; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid #152132; }
        .logo { font-size: 24px; font-weight: 600; color: #fff; }
        nav { display: flex; gap: 1.5rem; }
        nav a { color: #8fa8c8; text-decoration: none; font-size: 14px; }
        nav a:hover { color: #fff; }
        .unread-badge { background: #f87171; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-left: 0.5rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: #19273b; padding: 1.5rem; border-radius: 8px; border-left: 3px solid #8fa8c8; }
        .stat-label { color: #656d78; font-size: 12px; text-transform: uppercase; margin-bottom: 0.5rem; }
        .stat-value { font-size: 32px; font-weight: 600; color: #fff; }
        .filters { background: #19273b; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .filter-group { display: flex; flex-direction: column; }
        label { color: #8fa8c8; font-size: 12px; text-transform: uppercase; margin-bottom: 0.5rem; }
        select, input { background: #0a1628; border: 1px solid #152132; color: #fff; padding: 0.75rem; border-radius: 4px; }
        select:focus, input:focus { outline: none; border-color: #8fa8c8; }
        .candidates-list { display: grid; gap: 1rem; }
        .candidate-card { background: #19273b; padding: 1.5rem; border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 1.5rem; align-items: center; border-left: 3px solid #152132; }
        .candidate-card:hover { border-left-color: #8fa8c8; }
        .candidate-info h3 { color: #fff; margin-bottom: 0.5rem; }
        .candidate-meta { font-size: 13px; color: #656d78; display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 0.5rem; }
        .candidate-score { background: #0a1628; padding: 0.5rem 1rem; border-radius: 4px; color: #4ade80; font-weight: 600; font-size: 12px; }
        .candidate-score.low { color: #f87171; }
        .candidate-score.medium { color: #fbbf24; }
        .candidate-actions { display: flex; gap: 0.5rem; }
        button { padding: 0.5rem 1rem; background: #8fa8c8; color: #0a1628; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: background 0.3s; }
        button:hover { background: #a0b8d8; }
        button.secondary { background: #152132; color: #8fa8c8; }
        button.secondary:hover { background: #1e3244; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #19273b; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; }
        .modal-close { float: right; cursor: pointer; font-size: 24px; color: #656d78; }
        .modal-close:hover { color: #fff; }
        textarea { width: 100%; background: #0a1628; border: 1px solid #152132; color: #fff; padding: 0.75rem; border-radius: 4px; font-family: inherit; resize: vertical; }
        .error { color: #f87171; font-size: 12px; margin-top: 0.5rem; }
        .success { color: #4ade80; font-size: 12px; margin-top: 0.5rem; }
        .sent-badge { background: #4ade80; color: #0a1628; padding: 0.25rem 0.75rem; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .logout { cursor: pointer; color: #8fa8c8; }
        .logout:hover { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🦅 Corvus Talent</div>
            <nav>
                <a href="#" id="messagesLink">💬 Mensajes<span id="unreadBadge" class="unread-badge" style="display:none;"></span></a>
                <a href="#" id="logoutLink" class="logout">Salir</a>
            </nav>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Candidatos disponibles</div>
                <div class="stat-value" id="totalCandidates">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Score +70</div>
                <div class="stat-value" id="highScoreCandidates">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Disponibilidad inmediata</div>
                <div class="stat-value" id="availableCandidates">—</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Rubro</label>
                <select id="filterRubro" onchange="applyFilters()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Seniority</label>
                <select id="filterSeniority" onchange="applyFilters()">
                    <option value="">Todos</option>
                    <option value="Junior">Junior</option>
                    <option value="Mid">Mid-Level</option>
                    <option value="Senior">Senior</option>
                    <option value="Lead">Lead</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Modalidad</label>
                <select id="filterModality" onchange="applyFilters()">
                    <option value="">Todos</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Remoto">Remoto</option>
                    <option value="Híbrido">Híbrido</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Score mínimo</label>
                <input type="number" id="filterMinScore" min="0" max="100" placeholder="0-100" onchange="applyFilters()">
            </div>
        </div>

        <div class="candidates-list" id="candidatesList">
            <p style="text-align: center; color: #656d78;">Cargando candidatos...</p>
        </div>
    </div>

    <!-- Modal de contacto -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 1.5rem; color: #fff;">Enviar solicitud de contacto</h2>
            <form onsubmit="handleContactRequest(event)">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Email del candidato</label>
                    <input type="email" id="candidateEmail" readonly style="background: #0a1628; opacity: 0.7;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Mensaje (opcional)</label>
                    <textarea id="contactMessage" placeholder="Cuéntale sobre la oportunidad..." rows="4"></textarea>
                </div>
                <button type="submit" style="width: 100%; margin-bottom: 1rem;">Enviar solicitud</button>
                <div id="contactError" class="error"></div>
                <div id="contactSuccess" class="success"></div>
            </form>
        </div>
    </div>

    <script>
        let allCandidates = [];
        let sentRequests = new Set();
        const token = localStorage.getItem('corvus_token') || sessionStorage.getItem('corvus_token');

        if (!token) window.location.href = '/auth/';

        async function loadCandidates() {
            try {
                const res = await fetch('/api/candidates', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                allCandidates = data || [];
                
                // Cargar solicitudes ENVIADAS para marcar cuáles ya contactamos
                const sentRes = await fetch('/api/profile?type=contact_requests', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const sent = await sentRes.json();
                sentRequests = new Set((sent || []).map(r => r.candidate_email));

                loadRubros();
                applyFilters();
                updateStats();
            } catch (err) {
                console.error('Error loading candidates:', err);
            }
        }

        function loadRubros() {
            const rubros = [...new Set(allCandidates.map(c => c.rubro).filter(Boolean))].sort();
            const select = document.getElementById('filterRubro');
            rubros.forEach(rubro => {
                const option = document.createElement('option');
                option.value = rubro;
                option.textContent = rubro;
                select.appendChild(option);
            });
        }

        function applyFilters() {
            const rubro = document.getElementById('filterRubro').value;
            const seniority = document.getElementById('filterSeniority').value;
            const modality = document.getElementById('filterModality').value;
            const minScore = parseInt(document.getElementById('filterMinScore').value) || 0;

            const filtered = allCandidates.filter(c => {
                if (rubro && c.rubro !== rubro) return false;
                if (seniority && c.seniority !== seniority) return false;
                if (modality && c.modalidad !== modality) return false;
                if (c.cv_fit_score && c.cv_fit_score < minScore) return false;
                return true;
            });

            renderCandidates(filtered);
        }

        function renderCandidates(candidates) {
            const list = document.getElementById('candidatesList');
            if (candidates.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #656d78;">No hay candidatos que coincidan con los filtros.</p>';
                return;
            }

            list.innerHTML = candidates.map(c => {
                const score = c.cv_fit_score || 0;
                const scoreClass = score >= 70 ? '' : score >= 50 ? 'medium' : 'low';
                const alreadySent = sentRequests.has(c.email);

                return `
                    <div class="candidate-card">
                        <div class="candidate-info">
                            <h3>${c.nombre} ${c.apellido || ''}</h3>
                            <div class="candidate-meta">
                                <span>${c.rubro || 'N/A'}</span>
                                <span>${c.seniority || 'N/A'}</span>
                                <span>${c.modalidad || 'N/A'}</span>
                                <span>${c.disponibilidad || 'N/A'}</span>
                            </div>
                            ${c.cv_fit_score ? `<div class="candidate-score ${scoreClass}">Score: ${score}</div>` : ''}
                        </div>
                        <div class="candidate-actions">
                            ${alreadySent ? `<div class="sent-badge">✓ Solicitud enviada</div>` : `<button onclick="openContactModal('${c.email}')">Contactar</button>`}
                            <button class="secondary" onclick="alert('Ver perfil de ' + '${c.nombre}')">👁️ Ver</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const visible = allCandidates.filter(c => c.visible !== false);
            const highScore = visible.filter(c => c.cv_fit_score >= 70);
            const available = visible.filter(c => c.disponibilidad === 'Inmediato');

            document.getElementById('totalCandidates').textContent = visible.length;
            document.getElementById('highScoreCandidates').textContent = highScore.length;
            document.getElementById('availableCandidates').textContent = available.length;
        }

        function openContactModal(email) {
            document.getElementById('candidateEmail').value = email;
            document.getElementById('contactMessage').value = '';
            document.getElementById('contactError').textContent = '';
            document.getElementById('contactSuccess').textContent = '';
            document.getElementById('contactModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('contactModal').classList.remove('active');
        }

        async function handleContactRequest(e) {
            e.preventDefault();
            const email = document.getElementById('candidateEmail').value;
            const message = document.getElementById('contactMessage').value;
            const errorDiv = document.getElementById('contactError');
            const successDiv = document.getElementById('contactSuccess');

            errorDiv.textContent = '';
            successDiv.textContent = '';

            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action: 'contact_create',
                        candidate_email: email,
                        message: message
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                successDiv.textContent = 'Solicitud enviada correctamente';
                sentRequests.add(email);
                applyFilters();
                setTimeout(closeModal, 1500);
            } catch (err) {
                errorDiv.textContent = err.message;
            }
        }

        document.getElementById('logoutLink').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('corvus_token');
            sessionStorage.removeItem('corvus_token');
            window.location.href = '/auth/';
        });

        document.getElementById('messagesLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = '/chat/';
        });

        window.addEventListener('load', loadCandidates);
    </script>
</body>
</html>
