<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvus Craft — Generador de JD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #babdc2; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { color: #fff; font-size: 32px; margin-bottom: 0.5rem; }
        .subtitle { color: #656d78; font-size: 14px; }
        .form-section { background: #19273b; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        label { color: #8fa8c8; font-size: 12px; text-transform: uppercase; margin-bottom: 0.5rem; }
        input, textarea, select { background: #0a1628; border: 1px solid #152132; color: #fff; padding: 0.75rem; border-radius: 4px; font-family: inherit; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #8fa8c8; }
        textarea { resize: vertical; min-height: 100px; }
        button { background: #8fa8c8; color: #0a1628; border: none; padding: 0.75rem 2rem; border-radius: 4px; font-weight: 600; cursor: pointer; }
        button:hover { background: #a0b8d8; }
        button.loading { opacity: 0.5; cursor: not-allowed; }
        .output-section { background: #19273b; padding: 2rem; border-radius: 8px; display: none; }
        .output-section.active { display: block; }
        .output-text { background: #0a1628; padding: 1.5rem; border-radius: 4px; color: #babdc2; line-height: 1.6; white-space: pre-wrap; margin-bottom: 1rem; }
        .output-actions { display: flex; gap: 1rem; }
        .output-actions button { flex: 1; }
        .error { color: #f87171; font-size: 12px; margin-top: 0.5rem; }
        .limit-info { color: #656d78; font-size: 12px; margin-top: 1rem; }
        .nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .nav a { color: #8fa8c8; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; }
        .nav a:hover { background: #19273b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/dashboard/candidato/">← Volver</a>
            <a href="#" onclick="logout(); return false;">Salir</a>
        </div>

        <header>
            <h1>✦ Corvus Craft</h1>
            <p class="subtitle">Genera descripciones de puestos profesionales en segundos</p>
        </header>

        <div class="form-section">
            <form onsubmit="handleGenerate(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Título del puesto *</label>
                        <input type="text" id="title" placeholder="Ej: Senior Backend Developer" required>
                    </div>
                    <div class="form-group">
                        <label>Idioma</label>
                        <select id="lang">
                            <option value="es">Español</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Rubro</label>
                        <input type="text" id="industry" placeholder="Ej: Technology, Finance, etc.">
                    </div>
                    <div class="form-group">
                        <label>Seniority</label>
                        <select id="seniority">
                            <option value="">-- Selecciona --</option>
                            <option value="Junior">Junior</option>
                            <option value="Mid">Mid-Level</option>
                            <option value="Senior">Senior</option>
                            <option value="Lead">Lead/Manager</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Modalidad</label>
                        <select id="modality">
                            <option value="">-- Selecciona --</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de empresa</label>
                        <select id="companyType">
                            <option value="">-- Selecciona --</option>
                            <option value="Startup">Startup</option>
                            <option value="PME">PME</option>
                            <option value="Corporación">Corporación</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Skills técnicas</label>
                        <input type="text" id="skills" placeholder="Ej: Python, React, AWS, Docker">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Responsabilidades principales</label>
                        <textarea id="responsibilities" placeholder="Describe las principales responsabilidades del rol"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Tono</label>
                        <select id="tone">
                            <option value="Profesional">Profesional</option>
                            <option value="Dinámico">Dinámico</option>
                            <option value="Cercano">Cercano</option>
                            <option value="Técnico">Técnico</option>
                            <option value="Corporativo">Corporativo</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="generateBtn">Generar JD</button>
                <div id="generateError" class="error"></div>
                <p class="limit-info">Límite: 3 generaciones por día. Usos hoy: <span id="usageCount">0</span>/3</p>
            </form>
        </div>

        <div id="outputSection" class="output-section">
            <h2 style="color: #fff; margin-bottom: 1.5rem;">Job Description generada</h2>
            <div id="jdOutput" class="output-text"></div>
            <div class="output-actions">
                <button onclick="copyToClipboard()">📋 Copiar al portapapeles</button>
                <button onclick="downloadJD()">⬇️ Descargar como texto</button>
                <button onclick="resetForm()">✨ Nueva generación</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('corvus_token') || sessionStorage.getItem('corvus_token');
        if (!token) window.location.href = '/auth/';

        function getUsageCount() {
            const today = new Date().toISOString().split('T')[0];
            const key = `corvus_craft_usage_${today}`;
            return parseInt(localStorage.getItem(key) || '0');
        }

        function incrementUsageCount() {
            const today = new Date().toISOString().split('T')[0];
            const key = `corvus_craft_usage_${today}`;
            const count = getUsageCount();
            localStorage.setItem(key, (count + 1).toString());
        }

        document.getElementById('usageCount').textContent = getUsageCount();

        async function handleGenerate(e) {
            e.preventDefault();

            if (getUsageCount() >= 3) {
                document.getElementById('generateError').textContent = 'Límite diario alcanzado. Vuelve mañana.';
                return;
            }

            const btn = document.getElementById('generateBtn');
            const errorDiv = document.getElementById('generateError');

            const title = document.getElementById('title').value;
            const industry = document.getElementById('industry').value || undefined;
            const seniority = document.getElementById('seniority').value || undefined;
            const modality = document.getElementById('modality').value || undefined;
            const companyType = document.getElementById('companyType').value || undefined;
            const skills = document.getElementById('skills').value || undefined;
            const responsibilities = document.getElementById('responsibilities').value || undefined;
            const lang = document.getElementById('lang').value;
            const tone = document.getElementById('tone').value;

            btn.classList.add('loading');
            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/corvus', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action: 'generate_jd',
                        title,
                        industry,
                        seniority,
                        modality,
                        companyType,
                        skills,
                        responsibilities,
                        lang,
                        tone
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                document.getElementById('jdOutput').textContent = data.text;
                document.getElementById('outputSection').classList.add('active');
                incrementUsageCount();
                document.getElementById('usageCount').textContent = getUsageCount();
            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                btn.classList.remove('loading');
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('jdOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ Copiado al portapapeles');
            }).catch(() => {
                alert('Error al copiar');
            });
        }

        function downloadJD() {
            const text = document.getElementById('jdOutput').textContent;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jd_${new Date().getTime()}.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function resetForm() {
            document.getElementById('title').value = '';
            document.getElementById('industry').value = '';
            document.getElementById('seniority').value = '';
            document.getElementById('modality').value = '';
            document.getElementById('companyType').value = '';
            document.getElementById('skills').value = '';
            document.getElementById('responsibilities').value = '';
            document.getElementById('tone').value = 'Profesional';
            document.getElementById('generateError').textContent = '';
            document.getElementById('outputSection').classList.remove('active');
        }

        function logout() {
            localStorage.removeItem('corvus_token');
            sessionStorage.removeItem('corvus_token');
            window.location.href = '/auth/';
        }
    </script>
</body>
</html>
