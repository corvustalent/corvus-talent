<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvus Fit — Análisis CV vs JD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #babdc2; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { color: #fff; font-size: 32px; margin-bottom: 0.5rem; }
        .subtitle { color: #656d78; font-size: 14px; }
        .form-section { background: #19273b; padding: 2rem; border-radius: 8px; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: #8fa8c8; font-size: 12px; text-transform: uppercase; margin-bottom: 0.5rem; }
        input, textarea, select { width: 100%; background: #0a1628; border: 1px solid #152132; color: #fff; padding: 0.75rem; border-radius: 4px; font-family: inherit; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #8fa8c8; }
        button { background: #8fa8c8; color: #0a1628; border: none; padding: 0.75rem 2rem; border-radius: 4px; font-weight: 600; cursor: pointer; }
        button:hover { background: #a0b8d8; }
        button.loading { opacity: 0.5; cursor: not-allowed; }
        .results { background: #19273b; padding: 2rem; border-radius: 8px; display: none; }
        .results.active { display: block; }
        .score-bar { background: #0a1628; height: 40px; border-radius: 4px; overflow: hidden; margin-bottom: 2rem; }
        .score-fill { height: 100%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; }
        .score-fill.high { background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%); }
        .score-fill.medium { background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%); }
        .score-fill.low { background: linear-gradient(90deg, #f87171 0%, #dc2626 100%); }
        .result-section { margin-bottom: 2rem; }
        .result-section h3 { color: #8fa8c8; font-size: 14px; text-transform: uppercase; margin-bottom: 1rem; }
        .result-section ul { list-style: none; }
        .result-section li { padding: 0.75rem; background: #0a1628; margin-bottom: 0.5rem; border-radius: 4px; border-left: 3px solid #152132; }
        .result-section li.match { border-left-color: #4ade80; color: #4ade80; }
        .result-section li.gap { border-left-color: #f87171; color: #babdc2; }
        .result-section li.improvement { border-left-color: #fbbf24; color: #babdc2; }
        .error { color: #f87171; font-size: 12px; margin-top: 0.5rem; }
        .limit-info { color: #656d78; font-size: 12px; margin-top: 1rem; }
        .nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .nav a { color: #8fa8c8; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; }
        .nav a:hover { background: #19273b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/dashboard/candidato/">← Volver</a>
            <a href="#" onclick="logout(); return false;">Salir</a>
        </div>

        <header>
            <h1>🧩 Corvus Fit</h1>
            <p class="subtitle">Análisis de compatibilidad entre tu CV y una oferta de trabajo</p>
        </header>

        <div class="form-section">
            <form onsubmit="handleAnalyze(event)">
                <div class="form-group">
                    <label>Tu CV (texto plano)</label>
                    <textarea id="cvInput" placeholder="Pega aquí tu CV... Experiencia, habilidades, proyectos, etc." rows="8" required></textarea>
                </div>

                <div class="form-group">
                    <label>Título del puesto</label>
                    <input type="text" id="jobTitle" placeholder="Ej: Senior Backend Developer" required>
                </div>

                <div class="form-group">
                    <label>Descripción de la oferta</label>
                    <textarea id="jobDescription" placeholder="Pega aquí la descripción completa del puesto..." rows="8" required></textarea>
                </div>

                <button type="submit" id="analyzeBtn">Analizar Compatibilidad</button>
                <div id="analyzeError" class="error"></div>
                <p class="limit-info">Límite: 2 análisis por día. Usos hoy: <span id="usageCount">0</span>/2</p>
            </form>
        </div>

        <div id="resultsSection" class="results">
            <h2 style="color: #fff; margin-bottom: 2rem;">Resultados del análisis</h2>

            <div class="result-section">
                <div class="score-bar">
                    <div id="scoreFill" class="score-fill high" style="width: 0%;">0/100</div>
                </div>
                <p style="color: #656d78; font-size: 13px; margin-bottom: 1rem;">Tu compatibilidad con este puesto</p>
            </div>

            <div class="result-section">
                <h3>✓ Lo que coincide</h3>
                <ul id="matchesList"></ul>
            </div>

            <div class="result-section">
                <h3>⚠️ Lo que falta</h3>
                <ul id="gapsList"></ul>
            </div>

            <div class="result-section">
                <h3>💡 Mejoras para la entrevista</h3>
                <ul id="mejoras List"></ul>
            </div>

            <button onclick="resetForm()" style="width: 100%; margin-top: 2rem;">Nuevo análisis</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('corvus_token') || sessionStorage.getItem('corvus_token');
        if (!token) window.location.href = '/auth/';

        function getUsageCount() {
            const today = new Date().toISOString().split('T')[0];
            const key = `corvus_fit_usage_${today}`;
            return parseInt(localStorage.getItem(key) || '0');
        }

        function incrementUsageCount() {
            const today = new Date().toISOString().split('T')[0];
            const key = `corvus_fit_usage_${today}`;
            const count = getUsageCount();
            localStorage.setItem(key, (count + 1).toString());
        }

        document.getElementById('usageCount').textContent = getUsageCount();

        async function handleAnalyze(e) {
            e.preventDefault();
            const cv = document.getElementById('cvInput').value;
            const job_title = document.getElementById('jobTitle').value;
            const job_description = document.getElementById('jobDescription').value;
            const btn = document.getElementById('analyzeBtn');
            const errorDiv = document.getElementById('analyzeError');

            if (getUsageCount() >= 2) {
                errorDiv.textContent = 'Límite diario alcanzado. Vuelve mañana.';
                return;
            }

            btn.classList.add('loading');
            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/corvus', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        action: 'analyze_fit',
                        cv,
                        job_title,
                        job_description
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                renderResults(data);
                incrementUsageCount();
                document.getElementById('usageCount').textContent = getUsageCount();
            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                btn.classList.remove('loading');
            }
        }

        function renderResults(data) {
            const score = data.score || 0;
            const scoreClass = score >= 70 ? 'high' : score >= 50 ? 'medium' : 'low';
            
            document.getElementById('scoreFill').className = `score-fill ${scoreClass}`;
            document.getElementById('scoreFill').style.width = score + '%';
            document.getElementById('scoreFill').textContent = `${score}/100`;

            renderList('matchesList', data.matches || [], 'match');
            renderList('gapsList', data.gaps || [], 'gap');
            renderList('mejorasList', data.mejoras || [], 'improvement');

            document.getElementById('resultsSection').classList.add('active');
        }

        function renderList(elementId, items, className) {
            const list = document.getElementById(elementId);
            list.innerHTML = items.map(item => `<li class="${className}">• ${item}</li>`).join('');
        }

        function resetForm() {
            document.getElementById('cvInput').value = '';
            document.getElementById('jobTitle').value = '';
            document.getElementById('jobDescription').value = '';
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('analyzeError').textContent = '';
        }

        function logout() {
            localStorage.removeItem('corvus_token');
            sessionStorage.removeItem('corvus_token');
            window.location.href = '/auth/';
        }
    </script>
</body>
</html>
