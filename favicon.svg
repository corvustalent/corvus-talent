<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo navy -->
  <rect width="100" height="100" fill="#0A1628"/>
  
  <!-- Círculo slate de fondo sutil -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#8FA8C8" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Ícono de cuervo estilizado (C + espiral) -->
  <g transform="translate(50, 50)">
    <!-- "C" rotada con estilo minimalista -->
    <path d="M -8 -12 Q -15 -5 -15 0 Q -15 5 -8 12" 
          fill="none" stroke="#8FA8C8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Punto de acento (ojo del cuervo) -->
    <circle cx="8" cy="-5" r="2.5" fill="#8FA8C8"/>
    
    <!-- Línea diagonal (espíritu de movimiento) -->
    <line x1="3" y1="8" x2="12" y2="-8" stroke="#8FA8C8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Borde externo sutil -->
  <rect width="100" height="100" fill="none" stroke="#8FA8C8" stroke-width="1" opacity="0.3"/>
</svg>
