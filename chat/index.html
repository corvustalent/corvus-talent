<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensajes — Corvus Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1628;--navy-mid:#142038;--navy-light:#1E3050;--slate:#8FA8C8;--white:#FFFFFF;--gray:#9CA3AF;--border:rgba(143,168,200,0.2);--green:#4ADE80;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--white);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}

  nav{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
  .nav-brand{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--white);text-decoration:none}
  .nav-brand span{color:var(--slate)}
  .nav-back{font-size:13px;color:var(--slate);text-decoration:none;display:flex;align-items:center;gap:6px}

  .chat-layout{display:flex;flex:1;overflow:hidden}

  /* SIDEBAR */
  .sidebar{width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--slate);letter-spacing:1px;text-transform:uppercase}
  .conv-list{flex:1;overflow-y:auto}
  .conv-item{padding:14px 20px;cursor:pointer;border-bottom:1px solid rgba(143,168,200,0.06);transition:background 0.15s;display:flex;align-items:center;gap:12px}
  .conv-item:hover{background:var(--navy-mid)}
  .conv-item.active{background:var(--navy-light)}
  .conv-avatar{width:38px;height:38px;border-radius:50%;background:rgba(143,168,200,0.15);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--slate);flex-shrink:0}
  .conv-info{flex:1;min-width:0}
  .conv-name{font-size:13px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-preview{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .conv-badge{background:var(--slate);color:var(--navy);border-radius:10px;padding:2px 7px;font-size:10px;font-weight:700;flex-shrink:0}
  .empty-sidebar{padding:32px 20px;text-align:center;color:var(--gray);font-size:13px;line-height:1.6}

  /* MAIN CHAT */
  .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
  .chat-header-avatar{width:36px;height:36px;border-radius:50%;background:rgba(143,168,200,0.15);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--slate)}
  .chat-header-info{flex:1}
  .chat-header-name{font-size:14px;font-weight:600;color:var(--white)}
  .chat-header-sub{font-size:11px;color:var(--gray)}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:14px;flex-direction:column;gap:12px}
  .chat-empty-icon{font-size:40px}

  /* MESSAGES */
  .messages-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg-row{display:flex;gap:8px;align-items:flex-end}
  .msg-row.mine{flex-direction:row-reverse}
  .msg-bubble{max-width:65%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5}
  .msg-row.theirs .msg-bubble{background:var(--navy-mid);border:1px solid var(--border);color:var(--white);border-bottom-left-radius:4px}
  .msg-row.mine .msg-bubble{background:var(--slate);color:var(--navy);font-weight:500;border-bottom-right-radius:4px}
  .msg-time{font-size:10px;color:var(--gray);white-space:nowrap;margin-bottom:2px}
  .msg-avatar{width:28px;height:28px;border-radius:50%;background:rgba(143,168,200,0.15);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--slate);flex-shrink:0}

  /* INPUT */
  .chat-input-area{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
  .chat-input{flex:1;background:var(--navy-mid);border:1px solid var(--border);border-radius:24px;padding:10px 18px;color:var(--white);font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s;resize:none;max-height:120px;line-height:1.4}
  .chat-input:focus{border-color:var(--slate)}
  .chat-input::placeholder{color:var(--gray)}
  .send-btn{background:var(--slate);border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 0.15s;flex-shrink:0;color:var(--navy);font-size:16px}
  .send-btn:hover{opacity:0.85}
  .send-btn:disabled{opacity:0.35;cursor:not-allowed}

  @media(max-width:600px){
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);height:40vh}
    .chat-layout{flex-direction:column}
    .chat-main{height:60vh}
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">CORVUS <span>TALENT</span></a>
  <a id="back-link" href="/" class="nav-back">← Mi dashboard</a>
</nav>

<div class="chat-layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">Mensajes</div>
    <div class="conv-list" id="conv-list">
      <div class="empty-sidebar">Cargando conversaciones...</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="chat-main" id="chat-main">
    <div class="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div>Seleccioná una conversación</div>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('corvus_token');
const userRaw = localStorage.getItem('corvus_user');
if (!token || !userRaw) { window.location.href = '/auth'; }
const user = JSON.parse(userRaw);

// Back link según rol
document.getElementById('back-link').href = user.role === 'recruiter' ? '/dashboard/recruiter' : '/dashboard/candidato';

let currentConvId = null;
let pollInterval = null;

// ── LOAD CONVERSATIONS ─────────────────────────────────────
async function loadConversations() {
  try {
    const res = await fetch('/api/chat', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    renderConversations(data.conversations || []);
  } catch(e) {
    document.getElementById('conv-list').innerHTML = '<div class="empty-sidebar">Error al cargar conversaciones.</div>';
  }
}

function renderConversations(convs) {
  const list = document.getElementById('conv-list');
  if (!convs.length) {
    list.innerHTML = '<div class="empty-sidebar">No tenés conversaciones todavía.<br>Aceptá una solicitud de contacto para empezar.</div>';
    return;
  }

  list.innerHTML = convs.map(c => {
    const other = user.role === 'recruiter' ? c.candidate : c.recruiter;
    const name = other?.nombre ? `${other.nombre} ${other.apellido || ''}`.trim() : (c.recruiter_company || 'Usuario');
    const initial = name[0]?.toUpperCase() || '?';
    const unread = c.unread > 0 ? `<span class="conv-badge">${c.unread}</span>` : '';
    return `
      <div class="conv-item ${currentConvId === c.id ? 'active' : ''}" onclick="openConversation('${c.id}', '${name}', '${initial}')">
        <div class="conv-avatar">${initial}</div>
        <div class="conv-info">
          <div class="conv-name">${name}</div>
          <div class="conv-preview">${c.recruiter_company || ''}</div>
        </div>
        ${unread}
      </div>
    `;
  }).join('');
}

// ── OPEN CONVERSATION ──────────────────────────────────────
async function openConversation(convId, name, initial) {
  currentConvId = convId;
  loadConversations(); // refresh sidebar

  document.getElementById('chat-main').innerHTML = `
    <div class="chat-header">
      <div class="chat-header-avatar">${initial}</div>
      <div class="chat-header-info">
        <div class="chat-header-name">${name}</div>
        <div class="chat-header-sub">Conversación activa</div>
      </div>
    </div>
    <div class="messages-area" id="messages-area"></div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chat-input" placeholder="Escribí un mensaje..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  `;

  await loadMessages();

  // Poll cada 3 segundos
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(loadMessages, 3000);
}

async function loadMessages() {
  if (!currentConvId) return;
  try {
    const res = await fetch(`/api/chat?conversation_id=${currentConvId}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    renderMessages(data.messages || []);
  } catch(e) {}
}

function renderMessages(messages) {
  const area = document.getElementById('messages-area');
  if (!area) return;
  const wasAtBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 50;

  area.innerHTML = messages.map(m => {
    const isMine = m.sender_id === user.id;
    const time = new Date(m.created_at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="msg-row ${isMine ? 'mine' : 'theirs'}">
        ${!isMine ? `<div class="msg-avatar">?</div>` : ''}
        <div>
          <div class="msg-time" style="text-align:${isMine ? 'right' : 'left'}">${time}</div>
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
        </div>
      </div>
    `;
  }).join('');

  if (wasAtBottom) area.scrollTop = area.scrollHeight;
}

// ── SEND MESSAGE ───────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const message = input?.value.trim();
  if (!message || !currentConvId) return;

  btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  try {
    await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ conversation_id: currentConvId, message })
    });
    await loadMessages();
  } catch(e) {
    input.value = message; // restaurar si falla
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── INIT ───────────────────────────────────────────────────
loadConversations();

// Auto-abrir si viene con conversation_id en la URL
const urlParams = new URLSearchParams(window.location.search);
const convId = urlParams.get('conv');
if (convId) openConversation(convId, '...', '?');
</script>
</body>
</html>
