<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Corvus Talent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #152132 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #0a1628; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #8fa8c8;
            box-shadow: 0 0 0 3px rgba(143, 168, 200, 0.1);
        }
        .form-check {
            display: flex;
            align-items: center;
            margin: 1rem 0;
        }
        .form-check input[type="checkbox"] {
            width: auto;
            margin-right: 0.5rem;
        }
        .form-check label {
            margin: 0;
            font-weight: 400;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #0a1628;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 0.5rem;
        }
        button:hover {
            background: #152132;
        }
        button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        a {
            color: #8fa8c8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .link-section {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>🦅 Corvus Talent</h1>
        
        <div class="error" id="error-msg"></div>
        <div class="success" id="success-msg"></div>
        
        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-check">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Recordarme</label>
            </div>
            
            <button type="submit" id="submit-btn">Ingresar</button>
            <button type="button" id="signup-btn">Crear cuenta</button>
        </form>
        
        <div class="link-section">
            <a href="/forgot-password">¿Olvidaste la contraseña?</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMe = document.getElementById('remember-me');
        const submitBtn = document.getElementById('submit-btn');
        const signupBtn = document.getElementById('signup-btn');
        const errorDiv = document.getElementById('error-msg');
        const successDiv = document.getElementById('success-msg');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(msg) {
            successDiv.textContent = msg;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            signupBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Cargando...' : 'Ingresar';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                console.log('[LOGIN] POST /api/auth con email:', email);

                // Enviar POST a nuestro endpoint /api/auth
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'login',
                        email: email,
                        password: password
                    })
                });

                console.log('[LOGIN] Response status:', response.status);

                const data = await response.json();
                console.log('[LOGIN] Response data:', data);

                if (!response.ok) {
                    console.error('[LOGIN] Error:', data.error);
                    showError(`Error: ${data.error || 'Login fallido'}`);
                    setLoading(false);
                    return;
                }

                console.log('[LOGIN] ✅ Login exitoso');

                // GUARDAR TOKEN como solo el email
                localStorage.setItem('corvus_token', email);
                console.log('[LOGIN] Token guardado:', email);

                // Guardar usuario (si viene en la respuesta)
                if (data.user) {
                    localStorage.setItem('corvus_user', JSON.stringify(data.user));
                    console.log('[LOGIN] Perfil guardado:', data.user);
                } else {
                    localStorage.setItem('corvus_user', JSON.stringify({ 
                        email, 
                        nombre: email.split('@')[0],
                        role: data.role || 'candidato'
                    }));
                }

                showSuccess('✅ Inicio de sesión exitoso. Redirigiendo...');
                setTimeout(() => {
                    // Redirigir según rol
                    const role = data.user?.role || data.role;
                    if (role === 'recruiter') {
                        window.location.href = '/dashboard/recruiter';
                    } else {
                        window.location.href = '/dashboard/candidato';
                    }
                }, 1000);
            } catch (error) {
                console.error('[LOGIN] Unexpected error:', error);
                showError('Error: ' + error.message);
                setLoading(false);
            }
        });

        signupBtn.addEventListener('click', () => {
            window.location.href = '/auth/signup';
        });

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('corvus_token');
            if (token) {
                console.log('[LOAD] Usuario ya logueado:', token);
                window.location.href = '/dashboard/candidato';
            }
        });
    </script>
</body>
</html>
