<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvit — Entrenamiento de Entrevistas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 1rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            background: #0a1628;
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.8rem; }
        .user-info { display: flex; gap: 1rem; align-items: center; }
        .logout-btn {
            background: #8fa8c8;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-box {
            background: #f5f7fa;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #8fa8c8;
        }
        .stat-number { font-size: 2rem; font-weight: bold; color: #0a1628; }
        .stat-label { color: #666; font-size: 0.9rem; margin-top: 0.5rem; }
        .questions { display: grid; gap: 1rem; }
        .question-card {
            background: #f5f7fa;
            padding: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .question-card:hover { border-left-color: #8fa8c8; transform: translateX(4px); }
        .question-title { font-weight: 600; margin-bottom: 0.5rem; }
        .question-meta { color: #666; font-size: 0.85rem; }
        .btn {
            background: #0a1628;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #152132; }
        .btn-secondary {
            background: #8fa8c8;
        }
        .btn-secondary:hover { background: #7a96b0; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 1rem;
        }
        .modal.active { display: flex; justify-content: center; align-items: center; }
        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .options {
            display: grid;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .option {
            background: #f5f7fa;
            padding: 1rem;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .option:hover { border-color: #8fa8c8; background: #eef2f8; }
        .option input { margin-right: 0.5rem; }
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 6px;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback.success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .feedback.error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Corvit</h1>
            <div class="user-info">
                <span id="user-name">Cargando...</span>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="card">
            <h2>Entrenamiento de Entrevistas</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Responde preguntas de entrevista y obtén feedback instantáneo de nuestro asistente IA.</p>
            
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-number" id="respuestas-hoy">0</div>
                    <div class="stat-label">Respuestas Hoy</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="streak">0</div>
                    <div class="stat-label">Racha Actual</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Preguntas Disponibles</h2>
            <div class="questions" id="questions-list">
                <p>Cargando preguntas...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="question-modal">
        <div class="modal-content">
            <h2 id="modal-question">Pregunta</h2>
            <div class="options" id="options-container"></div>
            <div class="feedback" id="feedback"></div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn" id="submit-btn" onclick="submitAnswer()" style="display: none;">Enviar Respuesta</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const PREGUNTAS = [
            { id: 1, rubro: "IT", nivel: "Junior", text: "¿Cuál fue tu primer proyecto en programación?" },
            { id: 2, rubro: "IT", nivel: "Senior", text: "¿Cómo escalas una aplicación Node.js?" },
            { id: 3, rubro: "Business", nivel: "Junior", text: "¿Por qué quieres trabajar en esta empresa?" },
            { id: 4, rubro: "Business", nivel: "Senior", text: "¿Cómo liderías un equipo en crisis?" },
        ];

        const OPCIONES = {
            1: [
                "Un proyecto universitario simple",
                "Un freelance que me contrató",
                "Una aplicación personal de prueba",
                "Ninguno, es mi primer trabajo"
            ],
            2: [
                "Usando clusters de Node",
                "Con load balancers y bases de datos distribuidas",
                "Escalando verticalmente",
                "No sé, nunca lo he hecho"
            ],
            3: [
                "Me atrae el desafío técnico",
                "Búsqueda de estabilidad económica",
                "El equipo y la cultura",
                "Ofrecen el mejor sueldo"
            ],
            4: [
                "Comunicación abierta y decisiones rápidas",
                "Centralizaría el control",
                "Buscaría culpables",
                "Dejaría que otros decidan"
            ]
        };

        let currentQuestion = null;
        let userToken = null;

        window.addEventListener('load', () => {
            userToken = localStorage.getItem('corvus_token');
            if (!userToken || userToken.trim() === '') {
                console.log('[CORVIT] No token, redirecting to /auth');
                window.location.href = '/auth';
                return;
            }
            console.log('[CORVIT] Logged in as:', userToken);
            document.getElementById('user-name').textContent = userToken.split('@')[0];
            loadQuestions();
            updateUsageStats();
        });

        function loadQuestions() {
            const list = document.getElementById('questions-list');
            list.innerHTML = PREGUNTAS.map(q => `
                <div class="question-card" onclick="openQuestion(${q.id})">
                    <div class="question-title">🎯 ${q.text}</div>
                    <div class="question-meta">${q.rubro} • Nivel ${q.nivel}</div>
                </div>
            `).join('');
        }

        function openQuestion(qid) {
            currentQuestion = PREGUNTAS.find(q => q.id === qid);
            document.getElementById('modal-question').textContent = currentQuestion.text;
            
            const container = document.getElementById('options-container');
            container.innerHTML = (OPCIONES[qid] || []).map((opt, idx) => `
                <label class="option">
                    <input type="radio" name="answer" value="${opt}">
                    ${opt}
                </label>
            `).join('');
            
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').classList.remove('show', 'success', 'error');
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('question-modal').classList.add('active');
        }

        async function submitAnswer() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert('Selecciona una opción');
                return;
            }

            document.getElementById('submit-btn').disabled = true;
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.innerHTML = '<p>Analizando tu respuesta...</p>';
            feedbackDiv.classList.add('show');

            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`
                    },
                    body: JSON.stringify({
                        question_id: currentQuestion.id,
                        question_text: currentQuestion.text,
                        answer: selected.value,
                        rubro: currentQuestion.rubro
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    feedbackDiv.innerHTML = `<strong>✅ Bien!</strong><p>${data.feedback || 'Tu respuesta fue aceptada.'}</p>`;
                    feedbackDiv.classList.add('success');
                    updateUsageStats();
                } else {
                    feedbackDiv.innerHTML = '<strong>⚠️ Error</strong><p>No se pudo procesar el feedback.</p>';
                    feedbackDiv.classList.add('error');
                }
            } catch (error) {
                console.error('[SUBMIT]:', error);
                feedbackDiv.innerHTML = '<strong>❌ Error</strong><p>Error de conexión</p>';
                feedbackDiv.classList.add('error');
            } finally {
                document.getElementById('submit-btn').disabled = false;
            }
        }

        function closeModal() {
            document.getElementById('question-modal').classList.remove('active');
        }

        function updateUsageStats() {
            const today = new Date().toISOString().split('T')[0];
            const key = `corvit_usage_${today}`;
            const usage = JSON.parse(localStorage.getItem(key) || '{"count":0}');
            document.getElementById('respuestas-hoy').textContent = usage.count;
        }

        function logout() {
            localStorage.removeItem('corvus_token');
            window.location.href = '/auth';
        }
    </script>
</body>
</html>
