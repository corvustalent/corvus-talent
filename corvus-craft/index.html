<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corvus Craft — Generador de Job Descriptions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0A1628 0%, #19273B 100%);
      color: #BABDC2;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 0.9rem;
      color: #8FA8C8;
      margin-top: 0.25rem;
    }

    nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: #8FA8C8;
      color: #0A1628;
    }

    .btn-primary:hover {
      background: #A8BFD8;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: #8FA8C8;
      border: 1px solid #8FA8C8;
    }

    .btn-secondary:hover {
      background: rgba(143, 168, 200, 0.1);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }

    @media (max-width: 1024px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .section {
      background: #19273B;
      border: 1px solid rgba(143, 168, 200, 0.2);
      border-radius: 8px;
      padding: 2rem;
    }

    .section h2 {
      color: #FFFFFF;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section h2 span {
      color: #8FA8C8;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: #8FA8C8;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      background: #0A1628;
      border: 1px solid #152132;
      border-radius: 6px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #8FA8C8;
      box-shadow: 0 0 0 2px rgba(143, 168, 200, 0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .btn-generate {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      background: #8FA8C8;
      color: #0A1628;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-generate:hover {
      background: #A8BFD8;
      transform: translateY(-2px);
    }

    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .output {
      background: #0A1628;
      border-left: 3px solid #8FA8C8;
      padding: 1.5rem;
      border-radius: 6px;
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #8FA8C8;
      font-size: 0.95rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #8FA8C8;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* HISTORIAL */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .history-item {
      background: #0A1628;
      border: 1px solid #152132;
      border-radius: 6px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .history-item:hover {
      border-color: #8FA8C8;
      background: rgba(143, 168, 200, 0.05);
    }

    .history-item-content {
      flex: 1;
      min-width: 0;
    }

    .history-item-title {
      color: #FFFFFF;
      font-weight: 600;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item-meta {
      color: #656D78;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .history-item-actions {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #8FA8C8;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .icon-btn:hover {
      background: rgba(143, 168, 200, 0.2);
      color: #FFFFFF;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #656D78;
    }

    .empty-state p {
      margin: 0.5rem 0;
      font-size: 0.95rem;
    }

    .limit-badge {
      display: inline-block;
      background: rgba(143, 168, 200, 0.1);
      color: #8FA8C8;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-top: 1rem;
    }

    .limit-badge.warning {
      background: rgba(255, 193, 7, 0.1);
      color: #FFC107;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4CAF50;
      color: #4CAF50;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>✦ Corvus Craft</h1>
        <p class="header-subtitle">Generador de Job Descriptions con IA</p>
      </div>
      <nav>
        <button class="btn btn-secondary" onclick="goToDashboard()">← Volver</button>
      </nav>
    </header>

    <div class="content">
      <!-- GENERADOR -->
      <div class="section">
        <h2><span>⚙</span> Crear Job Description</h2>
        
        <form id="jdForm">
          <div class="form-group">
            <label for="jobTitle">Título del Puesto *</label>
            <input type="text" id="jobTitle" placeholder="Ej: Senior Backend Engineer" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="company">Empresa *</label>
              <input type="text" id="company" placeholder="Ej: TechCorp" required>
            </div>
            <div class="form-group">
              <label for="location">Ubicación</label>
              <input type="text" id="location" placeholder="Ej: Buenos Aires, Remoto">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="language">Idioma *</label>
              <select id="language" required>
                <option value="es">Español</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="form-group">
              <label for="tone">Tono *</label>
              <select id="tone" required>
                <option value="formal">Formal</option>
                <option value="casual">Casual</option>
                <option value="amigable">Amigable</option>
                <option value="dinamico">Dinámico</option>
                <option value="tecnico">Técnico</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="responsibilities">Responsabilidades principales *</label>
            <textarea id="responsibilities" placeholder="Describe las principales responsabilidades del puesto" required></textarea>
          </div>

          <div class="form-group">
            <label for="requirements">Requisitos *</label>
            <textarea id="requirements" placeholder="Skills, experiencia, herramientas requeridas" required></textarea>
          </div>

          <div class="form-group">
            <label for="benefits">Beneficios (opcional)</label>
            <textarea id="benefits" placeholder="Ej: Remoto, flexible, stock options, etc."></textarea>
          </div>

          <button type="submit" class="btn-generate" id="generateBtn">
            Generar Job Description
          </button>

          <div id="limitInfo" class="limit-badge"></div>
          <div id="successMessage" style="display: none;" class="success-message">
            ✓ JD guardado en tu historial
          </div>
        </form>

        <div id="loading" class="loading" style="display: none; margin-top: 1rem;">
          <div class="spinner"></div>
          <span>Generando...</span>
        </div>

        <div id="output" style="display: none;">
          <div id="outputContent" class="output"></div>
          <button class="btn btn-secondary" style="margin-top: 1rem; width: 100%;" onclick="copyToClipboard()">
            📋 Copiar al portapapeles
          </button>
        </div>
      </div>

      <!-- HISTORIAL -->
      <div class="section">
        <h2><span>📚</span> Historial de JDs</h2>
        <ul id="historyList" class="history-list">
          <div class="empty-state">
            <p>📭 No hay JDs generadas aún</p>
            <p style="font-size: 0.85rem; margin-top: 0.5rem;">Crea una para que aparezca aquí</p>
          </div>
        </ul>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="clearHistory()">
          🗑 Limpiar historial
        </button>
      </div>
    </div>
  </div>

  <script src="../auth-check.js"></script>
  <script>
    const DAILY_LIMIT = 3;
    const STORAGE_KEY = 'corvus_craft_history';
    const USAGE_KEY = 'corvus_craft_usage';

    let currentOutput = null;

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      updateLimitBadge();
      renderHistory();
    });

    // Manejo del formulario
    document.getElementById('jdForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const generateBtn = document.getElementById('generateBtn');
      const loading = document.getElementById('loading');
      const output = document.getElementById('output');
      const outputContent = document.getElementById('outputContent');
      const successMessage = document.getElementById('successMessage');

      // Validar límite diario
      const remaining = getDailyRemaining();
      if (remaining <= 0) {
        alert('Límite diario alcanzado. Vuelve mañana.');
        return;
      }

      // Recopilar datos
      const formData = {
        jobTitle: document.getElementById('jobTitle').value,
        company: document.getElementById('company').value,
        location: document.getElementById('location').value,
        language: document.getElementById('language').value,
        tone: document.getElementById('tone').value,
        responsibilities: document.getElementById('responsibilities').value,
        requirements: document.getElementById('requirements').value,
        benefits: document.getElementById('benefits').value
      };

      generateBtn.disabled = true;
      loading.style.display = 'flex';
      output.style.display = 'none';
      successMessage.style.display = 'none';

      try {
        const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(formData)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Error generando JD');
        }

        const result = await response.json();
        currentOutput = result.jd;
        outputContent.textContent = result.jd;
        output.style.display = 'block';

        // Guardar en historial
        saveToHistory({
          title: formData.jobTitle,
          company: formData.company,
          language: formData.language,
          tone: formData.tone,
          content: result.jd,
          timestamp: new Date().toISOString()
        });

        // Actualizar uso
        addDailyUsage();
        updateLimitBadge();
        renderHistory();
        successMessage.style.display = 'block';
      } catch (error) {
        alert('Error: ' + error.message);
      } finally {
        generateBtn.disabled = false;
        loading.style.display = 'none';
      }
    });

    // HISTORIAL FUNCIONES
    function saveToHistory(item) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      history.unshift(item);
      history = history.slice(0, 50); // Mantener últimas 50
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const historyList = document.getElementById('historyList');

      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="empty-state">
            <p>📭 No hay JDs generadas aún</p>
            <p style="font-size: 0.85rem; margin-top: 0.5rem;">Crea una para que aparezca aquí</p>
          </div>
        `;
        return;
      }

      historyList.innerHTML = history.map((item, index) => `
        <li class="history-item">
          <div class="history-item-content" onclick="loadFromHistory(${index})">
            <div class="history-item-title">${item.title} @ ${item.company}</div>
            <div class="history-item-meta">
              ${item.language === 'en' ? '🇺🇸' : '🇦🇷'} ${item.tone} • ${new Date(item.timestamp).toLocaleDateString()}
            </div>
          </div>
          <div class="history-item-actions">
            <button class="icon-btn" onclick="copyHistoryItem(${index})" title="Copiar">📋</button>
            <button class="icon-btn" onclick="deleteHistoryItem(${index})" title="Eliminar">🗑</button>
          </div>
        </li>
      `).join('');
    }

    function loadFromHistory(index) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const item = history[index];
      if (item) {
        currentOutput = item.content;
        document.getElementById('outputContent').textContent = item.content;
        document.getElementById('output').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function copyHistoryItem(index) {
      const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const item = history[index];
      if (item) {
        navigator.clipboard.writeText(item.content);
        alert('✓ Copiado al portapapeles');
      }
    }

    function deleteHistoryItem(index) {
      if (confirm('¿Eliminar este JD del historial?')) {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        history.splice(index, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
      }
    }

    function clearHistory() {
      if (confirm('¿Limpiar todo el historial? No se puede deshacer.')) {
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
      }
    }

    // LÍMITE DIARIO
    function getDailyRemaining() {
      const today = new Date().toDateString();
      const usage = JSON.parse(localStorage.getItem(USAGE_KEY) || '{}');
      const todayUsage = usage[today] || 0;
      return Math.max(0, DAILY_LIMIT - todayUsage);
    }

    function addDailyUsage() {
      const today = new Date().toDateString();
      const usage = JSON.parse(localStorage.getItem(USAGE_KEY) || '{}');
      usage[today] = (usage[today] || 0) + 1;
      localStorage.setItem(USAGE_KEY, JSON.stringify(usage));
    }

    function updateLimitBadge() {
      const remaining = getDailyRemaining();
      const badge = document.getElementById('limitInfo');
      if (remaining > 0) {
        badge.textContent = `${remaining} generaciones disponibles hoy`;
        badge.classList.remove('warning');
      } else {
        badge.textContent = 'Límite diario alcanzado';
        badge.classList.add('warning');
      }
    }

    function copyToClipboard() {
      if (currentOutput) {
        navigator.clipboard.writeText(currentOutput);
        alert('✓ Copiado al portapapeles');
      }
    }

    function goToDashboard() {
      window.location.href = '../dashboard/candidato/';
    }
  </script>
</body>
</html>
