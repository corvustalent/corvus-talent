<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvus Craft — Generador de Job Descriptions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
        header {
            background: #0a1628;
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.8rem; }
        .user-info { display: flex; gap: 1rem; align-items: center; }
        .logout-btn {
            background: #8fa8c8;
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .card { background: white; border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 0.5rem; }
        input, select, textarea {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        .btn {
            background: #0a1628;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #152132; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        .result-box {
            background: #f5f7fa;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #8fa8c8;
            display: none;
            margin-top: 1.5rem;
        }
        .result-box.show { display: block; }
        .copy-btn {
            background: #8fa8c8;
            margin-top: 1rem;
        }
        .loading { text-align: center; }
        .spinner {
            border: 3px solid #ddd;
            border-top-color: #8fa8c8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✦ Corvus Craft</h1>
            <div class="user-info">
                <span id="user-name">Cargando...</span>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="card">
            <h2>Generador de Job Descriptions</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Crea ofertas profesionales con un solo clic.</p>
            
            <form id="craft-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Título del Puesto *</label>
                        <input type="text" name="job_title" placeholder="Ej: Senior Backend Developer" required>
                    </div>
                    <div class="form-group">
                        <label>Empresa *</label>
                        <input type="text" name="company" placeholder="Ej: Corvus Talent" required>
                    </div>
                    <div class="form-group">
                        <label>Nivel Senior *</label>
                        <select name="seniority" required>
                            <option value="">Selecciona</option>
                            <option value="Junior">Junior</option>
                            <option value="Semi-Senior">Semi-Senior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Modalidad *</label>
                        <select name="modality" required>
                            <option value="">Selecciona</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Idioma *</label>
                        <select name="language" required>
                            <option value="es">Español</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tono *</label>
                        <select name="tone" required>
                            <option value="">Selecciona</option>
                            <option value="formal">Formal</option>
                            <option value="casual">Casual</option>
                            <option value="amistoso">Amistoso</option>
                            <option value="tecnico">Técnico</option>
                            <option value="moderno">Moderno</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label>Requisitos Específicos (opcional)</label>
                    <textarea name="requirements" placeholder="Ej: React, Python, AWS..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn" style="margin-top: 1.5rem;">✨ Generar JD</button>
            </form>

            <div class="result-box" id="result">
                <div id="result-content"></div>
                <button class="btn copy-btn" onclick="copyToClipboard()">📋 Copiar al Portapapeles</button>
            </div>
        </div>
    </div>

    <script>
        let userToken = null;

        window.addEventListener('load', () => {
            userToken = localStorage.getItem('corvus_token');
            if (!userToken || userToken.trim() === '') {
                console.log('[CORVUS-CRAFT] No token, redirecting to /auth');
                window.location.href = '/auth';
                return;
            }
            console.log('[CORVUS-CRAFT] Logged in as:', userToken);
            document.getElementById('user-name').textContent = userToken.split('@')[0];
            document.getElementById('craft-form').addEventListener('submit', handleSubmit);
        });

        async function handleSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Generando...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${userToken}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    displayResult(result.jd || 'No se pudo generar la JD');
                } else {
                    displayResult('❌ Error al generar la JD');
                }
            } catch (error) {
                console.error('[GENERATE]:', error);
                displayResult('❌ Error de conexión');
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Generar JD';
            }
        }

        function displayResult(jd) {
            const resultBox = document.getElementById('result');
            const content = document.getElementById('result-content');
            content.textContent = jd;
            content.style.whiteSpace = 'pre-wrap';
            content.style.wordWrap = 'break-word';
            resultBox.classList.add('show');
        }

        function copyToClipboard() {
            const text = document.getElementById('result-content').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copiado al portapapeles');
            });
        }

        function logout() {
            localStorage.removeItem('corvus_token');
            window.location.href = '/auth';
        }
    </script>
</body>
</html>
