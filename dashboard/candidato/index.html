<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — Corvus Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628;--navy-mid:#142038;--navy-light:#1E3050;
    --slate:#8FA8C8;--white:#FFFFFF;--off-white:#F5F7FA;
    --gray:#9CA3AF;--border:rgba(143,168,200,0.2);
    --green:#4ADE80;--yellow:#FBBF24;--red:#F87171;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--navy);color:var(--white);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* NAV */
  nav{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--navy);z-index:100}
  .nav-brand{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--white);text-decoration:none}
  .nav-brand span{color:var(--slate)}
  .nav-right{display:flex;align-items:center;gap:16px}
  .nav-user{font-size:13px;color:var(--gray)}
  .btn-logout{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;color:var(--gray);font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.15s}
  .btn-logout:hover{border-color:var(--red);color:var(--red)}

  main{flex:1;max-width:760px;width:100%;margin:0 auto;padding:32px 24px}

  /* HEADER */
  .dashboard-header{margin-bottom:32px}
  .welcome{font-size:clamp(22px,4vw,30px);font-weight:700;margin-bottom:6px}
  .welcome span{color:var(--slate)}
  .header-sub{font-size:13px;color:var(--gray)}

  /* VISIBILITY TOGGLE */
  .visibility-card{background:var(--navy-mid);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .visibility-text strong{font-size:14px;color:var(--white);display:block;margin-bottom:3px}
  .visibility-text p{font-size:12px;color:var(--gray);line-height:1.5}
  .toggle{position:relative;width:44px;height:24px;flex-shrink:0}
  .toggle input{opacity:0;width:0;height:0}
  .toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(143,168,200,0.2);border-radius:24px;transition:0.3s}
  .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:var(--white);border-radius:50%;transition:0.3s}
  input:checked+.toggle-slider{background:var(--green)}
  input:checked+.toggle-slider::before{transform:translateX(20px)}

  /* TABS */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px}
  .tab{padding:10px 20px;border:none;background:none;color:var(--gray);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--white)}
  .tab.active{color:var(--white);border-bottom-color:var(--slate)}

  /* SECTION */
  .section{display:none}
  .section.active{display:block}
  .section-title{font-size:14px;font-weight:600;color:var(--slate);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}

  /* FORM */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:11px;color:var(--slate);letter-spacing:1px;text-transform:uppercase;font-weight:500}
  input[type=text],input[type=email],input[type=tel],select,textarea{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--white);font-family:inherit;font-size:13px;outline:none;transition:border-color 0.2s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--slate)}
  select
