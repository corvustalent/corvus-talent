<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvus Talent — Ingresar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1628; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 400px; width: 100%; padding: 2rem; background: #19273b; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .logo { text-align: center; font-size: 32px; margin-bottom: 2rem; }
        h1 { font-size: 24px; margin-bottom: 1.5rem; text-align: center; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #152132; }
        .tab { flex: 1; padding: 1rem; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab.active { border-bottom-color: #8fa8c8; color: #8fa8c8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 14px; color: #babdc2; }
        input, select { width: 100%; padding: 0.75rem; background: #0a1628; border: 1px solid #152132; border-radius: 4px; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #8fa8c8; box-shadow: 0 0 0 2px rgba(143, 168, 200, 0.1); }
        button { width: 100%; padding: 0.75rem; background: #8fa8c8; color: #0a1628; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        button:hover { background: #a0b8d8; }
        .error { color: #f87171; font-size: 12px; margin-top: 0.5rem; }
        .success { color: #4ade80; font-size: 12px; margin-top: 0.5rem; }
        .link { text-align: center; margin-top: 1rem; font-size: 13px; }
        .link a { color: #8fa8c8; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .loading { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🦅</div>
        <h1>Corvus Talent</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Ingresar</div>
            <div class="tab" onclick="switchTab('register')">Registrarse</div>
            <div class="tab" onclick="switchTab('verify')">Verificar Email</div>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="rememberMe"> Recordarme
                    </label>
                </div>
                <button type="submit" id="loginBtn">Ingresar</button>
                <div id="loginError" class="error"></div>
            </form>
            <div class="link"><a href="/forgot-password/">¿Olvidaste tu contraseña?</a></div>
        </div>

        <!-- REGISTER TAB -->
        <div id="register" class="tab-content">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>Contraseña (mín. 8 caracteres, 1 mayúscula, 1 número)</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <div class="form-group">
                    <label>Sos...</label>
                    <select id="registerRole" required>
                        <option value="">-- Selecciona --</option>
                        <option value="candidato">Buscando trabajo</option>
                        <option value="recruiter">Reclutador</option>
                    </select>
                </div>
                <button type="submit" id="registerBtn">Registrarse</button>
                <div id="registerError" class="error"></div>
                <div id="registerSuccess" class="success"></div>
            </form>
        </div>

        <!-- VERIFY TAB -->
        <div id="verify" class="tab-content">
            <form onsubmit="handleVerify(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="verifyEmail" required>
                </div>
                <div class="form-group">
                    <label>Token de verificación (revisa tu email)</label>
                    <input type="text" id="verifyToken" required>
                </div>
                <button type="submit" id="verifyBtn">Verificar Email</button>
                <div id="verifyError" class="error"></div>
                <div id="verifySuccess" class="success"></div>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            btn.classList.add('loading');
            errorDiv.textContent = '';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                // Guardar token
                const storage = rememberMe ? localStorage : sessionStorage;
                storage.setItem('corvus_token', data.email);
                storage.setItem('corvus_user', JSON.stringify(data));

                // Redirect
                window.location.href = data.role === 'candidato' ? '/dashboard/candidato/' : '/dashboard/recruiter/';
            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                btn.classList.remove('loading');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;
            const btn = document.getElementById('registerBtn');
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');

            btn.classList.add('loading');
            errorDiv.textContent = '';
            successDiv.textContent = '';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'register', email, password, nombre, role })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                successDiv.textContent = 'Revisa tu email para verificar tu cuenta.';
                document.getElementById('registerName').value = '';
                document.getElementById('registerEmail').value = '';
                document.getElementById('registerPassword').value = '';
                document.getElementById('registerRole').value = '';
            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                btn.classList.remove('loading');
            }
        }

        async function handleVerify(e) {
            e.preventDefault();
            const email = document.getElementById('verifyEmail').value;
            const token = document.getElementById('verifyToken').value;
            const btn = document.getElementById('verifyBtn');
            const errorDiv = document.getElementById('verifyError');
            const successDiv = document.getElementById('verifySuccess');

            btn.classList.add('loading');
            errorDiv.textContent = '';
            successDiv.textContent = '';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify', email, token })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                successDiv.textContent = 'Email verificado. Ahora puedes ingresar.';
                setTimeout(() => switchTab('login'), 2000);
            } catch (err) {
                errorDiv.textContent = err.message;
            } finally {
                btn.classList.remove('loading');
            }
        }

        // Pre-fill verify tab si viene del email link
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('token')) {
            document.getElementById('verifyToken').value = urlParams.get('token');
            document.getElementById('verifyEmail').value = urlParams.get('email') || '';
            switchTab('verify');
        }
    </script>
</body>
</html>
